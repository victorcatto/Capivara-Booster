name: Build & Validate Rust (Tauri v2)

on:
  push:
    branches: [main, rust]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true

      - name: Cache Tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri.exe
          key: tauri-cli-v2-stable-windows

      - name: Install Tauri CLI (skip se cacheado)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\.cargo\bin\tauri.exe")) {
            cargo install tauri-cli --version "^2" --locked
          } else {
            Write-Host "tauri-cli cacheado: pulando compilacao"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: npm-ui-${{ hashFiles('ui/package-lock.json') }}

      - name: Build Frontend (UI)
        working-directory: ui
        run: |
          if (-not (Test-Path node_modules)) { npm ci }
          npm run build

      - name: Check Rust Compilation
        working-directory: src-tauri
        run: cargo check

      - name: Run Rust Tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and Bundle Rust Installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload Rust Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapivaraBooster-Rust-v2.0.0
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Validate Installer Exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer was not generated" }
          $conf = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $conf.version
          $versioned = "src-tauri/target/release/bundle/nsis/CapivaraBooster-Setup-v$version.exe"
          $direct = "src-tauri/target/release/bundle/nsis/CapivaraBooster-Setup.exe"
          Copy-Item $installer.FullName $versioned -Force
          Copy-Item $installer.FullName $direct -Force
          $versionHash = (Get-FileHash $versioned -Algorithm SHA256).Hash
          $directHash = (Get-FileHash $direct -Algorithm SHA256).Hash
          if ($versionHash -ne $directHash) { Write-Error "Versioned and direct installers differ" }
          $size = (Get-Item $versioned).Length / 1MB
          Write-Host "Validated installer: $(Split-Path $versioned -Leaf) ($([math]::Round($size, 2)) MB)"
          Write-Host "Direct download asset: $(Split-Path $direct -Leaf)"
