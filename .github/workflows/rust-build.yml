name: Build & Validate Rust (Tauri v2)

on:
  push:
    branches: [rust]
  pull_request:
    branches: [main, rust]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend (UI)
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Check Rust Compilation
        working-directory: src-tauri
        run: cargo check

      - name: Run Rust Tests
        working-directory: src-tauri
        run: cargo test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and Bundle Rust Installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Validate Installer Exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer was not generated" }
          $versioned = "src-tauri/target/release/bundle/nsis/CapivaraBooster-Setup-v2.0.0.exe"
          $direct = "src-tauri/target/release/bundle/nsis/CapivaraBooster-Setup.exe"
          Copy-Item $installer.FullName $versioned -Force
          Copy-Item $installer.FullName $direct -Force
          $versionHash = (Get-FileHash $versioned -Algorithm SHA256).Hash
          $directHash = (Get-FileHash $direct -Algorithm SHA256).Hash
          if ($versionHash -ne $directHash) { Write-Error "Versioned and direct installers differ" }
          $manifest = Get-Content -Raw version.json | ConvertFrom-Json
          if ($manifest.version -ne "1.1.4") { Write-Error "Do not change production version.json from the Rust build workflow" }
          $size = (Get-Item $versioned).Length / 1MB
          Write-Host "Validated legacy updater asset: $(Split-Path $versioned -Leaf) ($([math]::Round($size, 2)) MB)"
          Write-Host "Direct download asset: $(Split-Path $direct -Leaf)"
