<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capivara Booster</title>
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <link rel="stylesheet" href="/src/styles/controls.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/logo.png" alt="Capivara Booster" />
        <div>
          <div class="brand-title">CAPIVARA BOOSTER</div>
          <div class="brand-version" data-app-version>v2.1.2 Rust Edition</div>
        </div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="dashboard"><img class="nav-ico" src="/icon-sistema.png" alt="" /> <span data-i18n="Nav_Dashboard">Painel Geral</span></button>
        <button class="nav-item" data-view="debloat"><img class="nav-ico" src="/icon-limpeza.png" alt="" /> <span data-i18n="Nav_Debloat">Remover Bloatware</span></button>
        <button class="nav-item" data-view="cleaner"><img class="nav-ico" src="/icon-limpeza.png" alt="" /> <span data-i18n="Nav_Cleaner">Limpar Cache</span></button>
        <button class="nav-item" data-view="boost"><img class="nav-ico" src="/icon-latencia.png" alt="" /> <span data-i18n="Nav_SystemBoost">Latência</span></button>
        <button class="nav-item" data-view="latency"><img class="nav-ico" src="/icon-latencia.png" alt="" /> <span data-i18n="Nav_LowLatency">Baixa Latência</span></button>
        <button class="nav-item" data-view="games"><img class="nav-ico" src="/icon-cs2.png" alt="" /> <span data-i18n="Nav_GameOptimizer">Otimizar Jogos</span></button>
        <button class="nav-item" data-view="poe"><img class="nav-ico" src="/icon-lol.png" alt="" /> <span data-i18n="Nav_Poe">Path of Exile</span></button>
        <button class="nav-item" data-view="backup"><img class="nav-ico" src="/icon-sistema.png" alt="" /> <span data-i18n="Nav_BackupRestore">Backup</span></button>
        <button class="nav-item" data-view="drivers"><img class="nav-ico" src="/icon-sistema.png" alt="" /> <span data-i18n="Nav_Drivers">Driver Booster</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" id="btn-check-updates" data-i18n="Nav_CheckUpdates">Verificar atualizações</button>
        <div class="sidebar-status" style="margin-top:10px;">
          <span class="dot"></span>
          <div>
            <div style="font-size:11px;font-weight:700;" data-i18n="App_AdminStatus">Modo Administrador Ativo</div>
            <div style="font-size:10px;color:var(--text-muted);" data-i18n="App_RingStatus">Acesso Privilegiado</div>
          </div>
        </div>
      </div>
    </aside>
    <main class="app-main">
      <div class="topbar">
        <span style="font-size:12.5px;color:var(--text-secondary);" data-i18n="App_Subtitle">Otimizador de Sistema e Performance Esports</span>
        <span class="topbar-spacer"></span>
        <div class="lang-switch">
          <button id="lang-pt" class="active">PT-BR</button>
          <button id="lang-en">EN-US</button>
        </div>
        <div id="auth-area" style="display:flex;align-items:center;gap:8px;"></div>
        <button class="btn btn-secondary btn-sm" id="btn-console-toggle" data-i18n="Console_Toggle">Mostrar / Ocultar Console</button>
      </div>
      <div class="content" id="view-host"></div>
      <div class="console-panel" id="console-panel">
        <div class="console-head">
          <strong data-i18n="Console_Title">Console de Execução em Tempo Real</strong>
          <span class="topbar-spacer"></span>
          <button class="btn btn-secondary btn-sm" id="btn-console-clear" data-i18n="Console_Clear">Limpar</button>
        </div>
        <div id="console-list"></div>
      </div>
    </main>
  </div>
  <div class="modal-overlay" id="auth-modal"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
