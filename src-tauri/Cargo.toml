[package]
name = "capivara-booster"
version = "2.0.0"
description = "Capivara Booster - Windows 10/11 Debloater, Junk Cleaner, System Latency & Esports Game Optimizer"
authors = ["Capivara Systems Engineering"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Power",
] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
rayon = "1.10"
chrono = "0.4"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
